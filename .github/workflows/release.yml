name: Release

# Tags are the stable ref in this repo: `main` is force-pushed by each export,
# so a tag is the only thing that reliably points at what shipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release and upload the .vsix

jobs:
  # Everything reversible. Deliberately NOT gated by an environment, so a dry
  # run exercises the whole pipeline without needing an approval.
  verify:
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # Publishing an artifact that failed its own tests is not a release.
      - run: npm test
      - run: xvfb-run -a npm run test:integration

      - name: Package
        id: package
        run: |
          npx @vscode/vsce package
          VSIX="$(ls -1 ./*.vsix | head -1 | xargs basename)"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Both registries publish this exact file, so they cannot drift.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error

  # Everything irreversible. A published version number can never be reused, so
  # this job requires a human to approve the `release` environment.
  publish:
    needs: verify
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "${{ needs.verify.outputs.vsix }}"

      # Open VSX serves the VS Code forks (Cursor, Windsurf, VSCodium,
      # code-server), which cannot use the Microsoft Marketplace at all.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "${{ needs.verify.outputs.vsix }}" -p "$OVSX_PAT"

      - name: GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ needs.verify.outputs.vsix }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Marketplace: https://marketplace.visualstudio.com/items?itemName=jonathan-lee.anchored-comments

          See CHANGELOG.md for what changed."
